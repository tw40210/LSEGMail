services:
  postgres:
    image: postgres:16-alpine
    container_name: lsegmail_postgres_dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rotationdb}
      POSTGRES_USER: ${POSTGRES_USER:-rotuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rotpass}
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ./backend/src/migrations/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rotuser} -d ${POSTGRES_DB:-rotationdb}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: node:20-alpine
    container_name: lsegmail_backend_dev
    working_dir: /app
    # Mount source so ts-node-dev watches real files
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev"
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgres://${POSTGRES_USER:-rotuser}:${POSTGRES_PASSWORD:-rotpass}@postgres:5432/${POSTGRES_DB:-rotationdb}
      GMAIL_CLIENT_ID: ${GMAIL_CLIENT_ID:-}
      GMAIL_CLIENT_SECRET: ${GMAIL_CLIENT_SECRET:-}
      # Host maps 80→Vite; Google must hit same origin as the app (not :5173 unless exposed)
      GMAIL_REDIRECT_URI: ${GMAIL_REDIRECT_URI:-http://localhost/api/gmail/callback}
      SESSION_SECRET: ${SESSION_SECRET:-changeme_secret_123}
      DEV_MODE: ${DEV_MODE:-}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "4000:4000"

  frontend:
    image: node:20-alpine
    container_name: lsegmail_frontend_dev
    working_dir: /app
    # Mount source so Vite HMR picks up every file change instantly
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev"
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: /api
      VITE_PROXY_TARGET: http://backend:4000
      VITE_HMR_CLIENT_PORT: 80
      # false/0 = hide Gmail tab, rotation Test Mail, and redirect /gmail (omit = on in Vite dev)
      VITE_DEV_MODE: ${VITE_DEV_MODE:-}
    depends_on:
      - backend
    ports:
      - "80:5173"

volumes:
  postgres_dev_data:
